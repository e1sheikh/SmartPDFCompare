[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "smart-pdf-compare"
version = "0.1.0"
description = "Text-aware PDF comparison, highlighting, and reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    {name = "Abdelrahman Elsheikh", email = "abdelrahmanelsheikh39@gmail.com"}
]
maintainers = [
    {name = "Abdelrahman Elsheikh", email = "abdelrahmanelsheikh39@gmail.com"}
]

keywords = ["pdf", "comparison", "diff", "pymupdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["PyMuPDF>=2.0"]

[project.optional-dependencies]
dev = ["build>=1.0", "pytest>=7.4", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/SmartPDFCompare/SmartPDFCompare"
Issues = "https://github.com/SmartPDFCompare/SmartPDFCompare/issues"

[project.scripts]
smart-pdf-compare = "smart_pdf_compare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_pdf_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
