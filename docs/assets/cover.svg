    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity=".17"/></filter>
  </defs>
  <rect width="1200" height="310" rx="30" fill="url(#background)"/>
  <g filter="url(#shadow)"><rect x="88" y="48" width="174" height="214" rx="16" fill="white"/><path d="M214 48v50h48" fill="#bfdbfe"/><path d="M214 48v50h48" fill="none" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/><path d="M124 126h92M124 154h92M124 210h92" stroke="#93c5fd" stroke-width="11" stroke-linecap="round"/><path d="M124 182h58" stroke="#ef4444" stroke-width="15" stroke-linecap="round"/><path d="M124 234h76" stroke="#22c55e" stroke-width="15" stroke-linecap="round"/></g>
